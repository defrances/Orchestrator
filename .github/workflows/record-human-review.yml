name: Record human review

on:
  repository_dispatch:
    types: [human-review]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: human-review-gh-pages
  cancel-in-progress: false

jobs:
  record:
    name: Append review on gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout Orchestrator
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append review
        if: github.event_name == 'repository_dispatch'
        env:
          REVIEW_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          mkdir -p gh-pages
          python3 scripts/append-human-review.py --site gh-pages --payload-env REVIEW_PAYLOAD

      - name: Commit reviews
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd gh-pages
          if [ ! -d .git ]; then
            git init
            git checkout -B gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add data/reviews.json assets/reviews.js
          if git diff --cached --quiet; then
            echo "No review files to commit."
            exit 0
          fi
          git commit -m "Record human review overlay on the Pages report."
          git push origin HEAD:gh-pages

      - name: Stage site for Pages
        run: |
          set -euo pipefail
          rm -rf site-out
          mkdir site-out
          cp -a gh-pages/. site-out/
          rm -rf site-out/.git
          mkdir -p site-out/assets
          cp scripts/pages/app.js site-out/assets/app.js
          cp scripts/pages/style.css site-out/assets/style.css
          cp scripts/pages/index.html site-out/index.html
          rm -f site-out/data/github.json site-out/.secrets/github.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-out

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
